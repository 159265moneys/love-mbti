<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <title>恋愛傾向診断（ページング版・ハート塗りルール調整済み）</title>
  <style>
:root{
  --pos:#fb64b6; --pos-light:#ffe3ea;
  --neg:#278733; --neg-light:#e7f3ff;
  --bg:#ffffff; --fg:#111111;
  --container-max:780px;
  --gutter-desktop:20px;
  --gutter-mobile:12px;
  --dot-min:34px; --dot-max:56px; --ring:8px; --gap:12px;
  --card-radius:10px;
  --card-shadow:0 6px 18px rgba(0,0,0,0.04);
   --label-personality:#6c5ce7; /* 性格 */
  --label-love:#fb64b6;        /* 恋愛の性質 */
  --label-match:#00d5be;       /* 相性（おすすめ） */
   --label-tip:#ff9800;         /* 付き合い方のコツ*/
}
/* reset-lite */
*, *::before, *::after { box-sizing:border-box; }
html, body { height:100%; margin:0; padding:0; }
body{
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--fg);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:18px 0;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.page{
  width:100%;
  max-width:calc(var(--container-max) + var(--gutter-desktop)*2);
  padding:0 var(--gutter-desktop);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  margin:0 auto;
}
.hero img{ width:100%; height:auto; display:block; object-fit:cover; border-radius:0; }
.container{ width:100%; max-width:var(--container-max); margin:0 auto; }
/* 質問カード */
.question-block{
  background:#fff;
  border-radius:var(--card-radius);
  padding:14px 14px 26px;
  margin-bottom:18px;
  box-shadow:var(--card-shadow);
  text-align:left;
}
.question-text{ font-size:18px; margin:0 0 10px; line-height:1.5; }
.scale-labels{ display:flex; justify-content:space-between; align-items:center; font-size:12px; margin:4px 0 10px; }
.scale-labels .neg{ color:var(--neg); }
.scale-labels .pos{ color:var(--pos); }
.choices{
  display:flex; gap:var(--gap);
  justify-content:center;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding:8px calc(6px + var(--ring)) 10px;
  --dot: clamp(var(--dot-min), calc((100% - (var(--gap) * 5)) / 6), var(--dot-max));
}
.choices::before, .choices::after{ content:""; flex:0 0 8px; }
/* ハート型ボタン（見た目はJSで完全制御） */
.choice-btn{
  width:calc(var(--dot) * var(--mult, 1));
  aspect-ratio:1 / 1;
  border:none; background:transparent;
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer;
  position:relative; z-index:3;
  user-select:none; -webkit-tap-highlight-color:transparent;
  padding:0; line-height:1;
  transition:transform .12s ease, filter .12s ease;
}
/* ← ご要望によりフォーカスのグレー枠は完全に消します */
.choice-btn:focus{ outline:none; }
.choice-btn:focus-visible{ outline:none; }
.choice-btn svg{ width:100%; height:100%; display:block; }
.choice-btn[data-size="100"]{ --mult:1.00; }
.choice-btn[data-size="85"] { --mult:0.85; }
.choice-btn[data-size="70"] { --mult:0.70; }
/* ページングUI */
.pager{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin:0 auto; max-width:var(--container-max); width:100%;
}
.pager .left, .pager .right{ display:flex; gap:8px; }
/* ボタン幅を一定にして、visibility:hiddenでもスペースを確保 */
.pager-btn{
  background:#fff; border:1px solid #e5e5e5; border-radius:8px;
  padding:10px 14px; cursor:pointer; box-shadow:var(--card-shadow);
  min-width:88px; text-align:center;
}
.pager-btn[disabled]{ opacity:.5; cursor:not-allowed; }
.page-dots{ display:flex; gap:6px; align-items:center; justify-content:center; flex:1; }
.page-dot{ width:8px; height:8px; border-radius:999px; background:#e3e3e3; }
.page-dot.active{ background:linear-gradient(90deg,var(--pos),var(--neg)); }
/* アクション＆結果 */
.actions{ display:flex; justify-content:center; gap:12px; margin:12px auto 24px; }
#result-btn{ background:#000; color:#fff; padding:12px 20px; font-size:16px; border-radius:8px; border:none; cursor:pointer; }
#result-btn[disabled]{ opacity:.48; cursor:not-allowed; }
#loading{ display:none; font-size:14px; color:#666; align-self:center; }
#result-panel{
  opacity:0; transform:translateY(8px);
  transition:opacity .3s ease, transform .3s ease;
  display:none; background:#fff; box-shadow:var(--card-shadow);
  border-radius:12px; padding:8px; margin:12px auto 60px; max-width:var(--container-max);
}
#result-panel.show{ display:block; opacity:1; transform:translateY(0); }
#result-slot img{ display: block; max-width:65%; margin: 0 auto; border-radius:12px;}
#result-slot h3{ margin:6px 0 6px; font-size:18px; }
#result-slot p{ margin:0 0 40px; line-height:1.7; }
.present_banner{width: 75%;}
.cta-btn{ display:inline-block; color:#fff; border-radius:6px; text-decoration:none; font-weight:600; }
.cta-btn img{max-width: 90% !important;}
/* 進捗バー */
.progress{background:#fff; padding:8px 0; z-index:5; box-shadow:0 1px 0 rgba(0,0,0,0.04); }
.progress-inner{ max-width:var(--container-max); margin:0 auto; padding:0 6px; display:flex; gap:10px; align-items:center; }
#progress-text{ font-size:12px; color:#666; text-align:right; }
.progress-rail{ flex:1; height:6px; background:#eee; border-radius:999px; overflow:hidden; }
#progress-bar{ height:100%; width:0%; background:linear-gradient(90deg,var(--pos),var(--neg)); }
img, video { max-width: 100%; height: auto; }
#result-title{
    font-size: 24px;
    text-align: center;
}
.match-job{
  color: blue;
  font-weight:bold;
  display: block;
  margin-top: 15px;
}

/* TODO 年齢区分版にも統合 */
.match-type-name{
    display: block;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}
@media (max-width: 600px){
  .page{ padding:0 var(--gutter-mobile); max-width:calc(var(--container-max) + var(--gutter-mobile)*2); }
  .question-text{ font-size:16px; }
  .choices{
    --gap:8px; --ring:-8px;
    --row: calc(100% - (var(--gutter-mobile) * 2));
    --dot: clamp(36px, calc((var(--row) - (var(--gap) * 5)) / 6), 64px);
    padding:10px calc(8px + var(--ring)) 12px;
    gap:var(--gap);
  }
    #result-slot p{
        font-size: 14px;
    }
    #result-slot img{
        max-width:70%;
    }
    .cta-btn img{max-width: 100% !important;}
  .label{
    font-size: 20px;
    margin-top: 15px;
  }
  #result-title{
    font-size: 20px;
}
.present_banner{width: 100%;}
}
/* aspect-ratio 非対応フォールバック */
@supports not (aspect-ratio: 1 / 1) {
  .choice-btn{ position:relative; height:calc(var(--dot) * var(--mult, 1)); }
  .choice-btn::before{ content:""; display:block; padding-top:100%; }
  .choice-btn > *{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
}
.choices::-webkit-scrollbar{ height:8px; }
.choices::-webkit-scrollbar-thumb{ background:rgba(0,0,0,0.08); border-radius:8px; }
.label{
  display:block;
  text-align: center;
  font-weight:700;
  margin-top:25px;
  margin-bottom:4px;
  font-size: 22px;
}
.label--last{
  font-size: 28px;
  color: red;
}
.match-type{
  width: 40%;
  margin: 20px auto !important;
}
.label--personality{ color:var(--label-personality); }
.label--love{ color:var(--label-love); }
.label--match{ color:var(--label-match); }
.label--tip{ color:var(--label-tip); } 
</style>

function postToGoogleFormSilent(actionUrl, fields){
  try{

    if(scores.includes(null)){
      const idx = scores.indexOf(null);
      page = Math.floor(idx / PAGE_SIZE);
      renderPage();
      alert('未回答の設問があります。');
      return;
    }
    resultBtn.disabled = true;
    loading.style.display = 'block';
    // 集計
    sums.P1 = sums.P2 = sums.P3 = sums.P4 = 0;
    ITEMS.forEach((it, idx)=>{ sums[it.pair] += it.dir * scores[idx]; });
    // 2軸の差分
    const scoreX = (sums.P1 || 0) - (sums.P4 || 0); // 情熱 − 安定
    const scoreY = (sums.P2 || 0) - (sums.P3 || 0); // スペース − 対話
    const THRESH_X = Math.ceil(30 * 0.2);
    const THRESH_Y = Math.ceil(30 * 0.2);
    // 方向（0は中立→負側にも正側にも寄せないが、bit的には0）
    const dirX = scoreX > 0 ? 1 : (scoreX < 0 ? 0 : 0);
    const dirY = scoreY > 0 ? 1 : (scoreY < 0 ? 0 : 0);
    // 強度（|差|がしきい値以上）
    const strX = Math.abs(scoreX) >= THRESH_X ? 1 : 0;
    const strY = Math.abs(scoreY) >= THRESH_Y ? 1 : 0;
    // 4bit → 0..15 → +1 → 1..16
    const idx16 = (dirX<<3) | (strX<<2) | (dirY<<1) | (strY<<0);
    const typeId = idx16 + 1;
    setTimeout(()=>{
      loading.style.display = 'none';
      const c = TYPE_CONTENT[typeId] || {name:`Type ${typeId}`, img:`img/type${typeId}.jpg`, desc:`Type ${typeId} の説明（プレースホルダー）`};
      title.innerHTML = `<span style="font-size:15px;">あなたの結果は...</span><br>「${c.name}」`;
      slot.innerHTML = `
        <img src="${c.img}" alt="${c.name}">
        <p>${c.desc}${COMMON_TAIL}</p>
        <a class="cta-btn" href="https://maemukicareer.jp/lp/25ph/8j7v" rel="noopener">
            <img class="present_banner" src="https://agent.migi-nanameue.co.jp/wp-content/uploads/2025/09/%E8%BB%A2%E8%81%B7%E3%81%AE%E3%83%97%E3%83%AD%E3%81%8C%E5%BE%B9%E5%BA%95%E8%A7%A3%E8%AA%AC%E3%81%AE%E3%82%B3%E3%83%94%E3%83%BC-5.jpg" alt="スタバチケットプレゼント">
        </a>
      `;
      panel.classList.add('show');
      panel.scrollIntoView({ behavior:'smooth' });
    }, 500);
  });
})();
</script>
